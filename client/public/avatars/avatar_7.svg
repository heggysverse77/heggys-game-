<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="tracker_bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#CCFBF1" />
      <stop offset="60%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#134E4A" />
    </radialGradient>
  </defs>

  <!-- Outer Circle -->
  <circle cx="150" cy="150" r="142" fill="url(#tracker_bg)" stroke="#1A1A1A" stroke-width="8" />
  <circle cx="150" cy="150" r="133" fill="none" stroke="#2DD4BF" stroke-width="3" opacity="0.6" />

  <g clip-path="url(#tkClip)">
    <clipPath id="tkClip">
      <circle cx="150" cy="150" r="138" />
    </clipPath>

    <!-- Buckskin Jacket with Fringe -->
    <path d="M 40 300 C 50 215, 95 200, 150 200 C 205 200, 250 215, 260 300 Z" fill="#D97706" stroke="#1A1A1A" stroke-width="6" />
    <!-- Turquoise & Bone Choker Necklace -->
    <path d="M 120 190 Q 150 215 180 190" stroke="#0F766E" stroke-width="8" fill="none" />
    <circle cx="150" cy="204" r="5" fill="#5EEAD4" stroke="#1A1A1A" stroke-width="2" />

    <!-- Long Braided Dark Hair -->
    <path d="M 85 110 C 70 180, 80 250, 95 280 C 105 250, 105 180, 105 140 Z" fill="#1C1917" stroke="#1A1A1A" stroke-width="4" />
    <path d="M 215 110 C 230 180, 220 250, 205 280 C 195 250, 195 180, 195 140 Z" fill="#1C1917" stroke="#1A1A1A" stroke-width="4" />

    <!-- Face Base -->
    <path d="M 108 95 C 108 65, 192 65, 192 95 C 192 150, 172 185, 150 188 C 128 185, 108 150, 108 95 Z" fill="#E0A96D" stroke="#1A1A1A" stroke-width="5" />

    <!-- War Paint / Trail Accent across cheeks -->
    <path d="M 112 135 L 138 135" stroke="#991B1B" stroke-width="4" stroke-linecap="round" />
    <path d="M 162 135 L 188 135" stroke="#991B1B" stroke-width="4" stroke-linecap="round" />

    <!-- Focused Eyes -->
    <ellipse cx="128" cy="120" rx="8" ry="5.5" fill="#FFF" stroke="#1A1A1A" stroke-width="3" />
    <circle cx="130" cy="120" r="3.5" fill="#1A1A1A" />
    <ellipse cx="172" cy="120" rx="8" ry="5.5" fill="#FFF" stroke="#1A1A1A" stroke-width="3" />
    <circle cx="170" cy="120" r="3.5" fill="#1A1A1A" />

    <!-- Strong Brow -->
    <path d="M 118 108 Q 132 104 144 110" stroke="#1C1917" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M 156 110 Q 168 104 182 108" stroke="#1C1917" stroke-width="4.5" stroke-linecap="round" fill="none" />

    <!-- Nose & Stoic Mouth -->
    <path d="M 150 118 L 146 138 L 154 138" stroke="#B45309" stroke-width="3" fill="none" />
    <path d="M 138 158 Q 150 160 162 158" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Headband with Eagle Feather 🦅 -->
    <path d="M 98 85 Q 150 92 202 85" stroke="#0F766E" stroke-width="8" fill="none" />
    <circle cx="150" cy="88" r="4" fill="#F59E0B" />
    <!-- Eagle Feather sticking out on side -->
    <path d="M 195 85 C 220 50, 240 25, 235 15 C 225 25, 205 60, 190 80 Z" fill="#F8FAFC" stroke="#1A1A1A" stroke-width="3" />
    <path d="M 235 15 C 230 25, 220 30, 225 20 Z" fill="#1E293B" />
    <line x1="190" y1="80" x2="235" y2="15" stroke="#94A3B8" stroke-width="1.5" />
  </g>

  <circle cx="150" cy="150" r="142" fill="none" stroke="#1A1A1A" stroke-width="8" />
</svg>