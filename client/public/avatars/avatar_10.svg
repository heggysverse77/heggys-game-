<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="miner_bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="60%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#854D0E" />
    </radialGradient>
  </defs>

  <!-- Outer Circle -->
  <circle cx="150" cy="150" r="142" fill="url(#miner_bg)" stroke="#1A1A1A" stroke-width="8" />
  <circle cx="150" cy="150" r="133" fill="none" stroke="#FBBF24" stroke-width="3" opacity="0.6" />

  <g clip-path="url(#mnClip)">
    <clipPath id="mnClip">
      <circle cx="150" cy="150" r="138" />
    </clipPath>

    <!-- Red Flannel & Overalls -->
    <path d="M 40 300 C 50 215, 95 200, 150 200 C 205 200, 250 215, 260 300 Z" fill="#DC2626" stroke="#1A1A1A" stroke-width="6" />
    <!-- Blue Overalls Suspenders -->
    <path d="M 90 200 L 95 300" stroke="#1D4ED8" stroke-width="14" />
    <path d="M 210 200 L 205 300" stroke="#1D4ED8" stroke-width="14" />
    <circle cx="92" cy="225" r="4" fill="#F59E0B" stroke="#1A1A1A" stroke-width="1.5" />
    <circle cx="208" cy="225" r="4" fill="#F59E0B" stroke="#1A1A1A" stroke-width="1.5" />

    <!-- Face Base -->
    <path d="M 110 95 C 110 65, 190 65, 190 95 C 190 145, 170 170, 150 172 C 130 170, 110 145, 110 95 Z" fill="#FCEADE" stroke="#1A1A1A" stroke-width="5" />

    <!-- Big Bulbous Nose -->
    <circle cx="150" cy="126" r="12" fill="#F87171" stroke="#1A1A1A" stroke-width="3.5" />

    <!-- Bushy White Eyebrows -->
    <path d="M 114 105 Q 128 92 142 104" stroke="#F1F5F9" stroke-width="9" stroke-linecap="round" fill="none" />
    <path d="M 114 105 Q 128 92 142 104" stroke="#1A1A1A" stroke-width="1.5" fill="none" />
    <path d="M 158 104 Q 172 92 186 105" stroke="#F1F5F9" stroke-width="9" stroke-linecap="round" fill="none" />
    <path d="M 158 104 Q 172 92 186 105" stroke="#1A1A1A" stroke-width="1.5" fill="none" />

    <!-- Joyful Crinkle Eyes / Laughing Eyes -->
    <path d="M 122 118 Q 132 110 140 118" stroke="#1A1A1A" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M 160 118 Q 168 110 178 118" stroke="#1A1A1A" stroke-width="4.5" stroke-linecap="round" fill="none" />

    <!-- Massive Bushy White Prospector Beard & Big Mustache ⛏️ -->
    <path d="M 105 130 C 85 160, 95 240, 150 255 C 205 240, 215 160, 195 130 C 185 145, 115 145, 105 130 Z" fill="#F8FAFC" stroke="#1A1A1A" stroke-width="5" />
    <!-- Mustache Waves -->
    <path d="M 150 134 C 130 128, 110 148, 100 142 C 112 132, 138 128, 150 132 C 162 128, 188 132, 200 142 C 190 148, 170 128, 150 134 Z" fill="#E2E8F0" stroke="#1A1A1A" stroke-width="3.5" />
    <!-- Happy Smile showing 1 Gold Tooth! 🪙 -->
    <path d="M 140 148 Q 150 156 160 148" stroke="#1A1A1A" stroke-width="3" fill="#831843" />
    <rect x="148" y="148" width="4" height="4" fill="#F59E0B" />

    <!-- Slouchy Miner Fedora / Slouch Hat with Gold Nugget -->
    <path d="M 105 70 C 105 20, 120 15, 150 20 C 180 15, 195 20, 195 70 Z" fill="#78350F" stroke="#1A1A1A" stroke-width="6" />
    <path d="M 45 72 C 80 48, 220 48, 255 72 C 240 86, 60 86, 45 72 Z" fill="#78350F" stroke="#1A1A1A" stroke-width="6" />
    <!-- Hat Patch -->
    <rect x="120" y="38" width="16" height="14" rx="2" fill="#92400E" stroke="#1A1A1A" stroke-width="2" transform="rotate(8 128 45)" />
    <!-- Gold Nugget tucked in Hat Band -->
    <circle cx="178" cy="65" r="7" fill="#FBBF24" stroke="#1A1A1A" stroke-width="2" />
  </g>

  <circle cx="150" cy="150" r="142" fill="none" stroke="#1A1A1A" stroke-width="8" />
</svg>