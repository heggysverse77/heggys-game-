<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="derp_bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="70%" stop-color="#DCFCE7" />
      <stop offset="100%" stop-color="#86EFAC" />
    </radialGradient>
    <filter id="derp_shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#1A1A1A" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Comic Circle -->
  <circle cx="150" cy="150" r="142" fill="url(#derp_bg)" stroke="#1A1A1A" stroke-width="8" />
  <circle cx="150" cy="150" r="133" fill="none" stroke="#22C55E" stroke-width="3" opacity="0.6" />

  <!-- Floating Cartoon Question Marks `?` & Dizzy Birds in Background -->
  <!-- Left Question Mark -->
  <path d="M 52 75 C 50 65, 62 60, 68 66 C 74 72, 64 78, 64 84" fill="none" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round" />
  <circle cx="64" cy="93" r="2.5" fill="#1A1A1A" />

  <!-- Right Big Question Mark -->
  <path d="M 235 60 C 232 48, 248 42, 256 50 C 264 58, 252 66, 252 74" fill="none" stroke="#16A34A" stroke-width="5" stroke-linecap="round" />
  <circle cx="252" cy="85" r="3" fill="#16A34A" />

  <g clip-path="url(#derpClip)">
    <clipPath id="derpClip">
      <circle cx="150" cy="150" r="138" />
    </clipPath>

    <!-- Lime Green T-Shirt / Shoulders -->
    <path d="M 45 300 C 55 215, 95 200, 150 200 C 205 200, 245 215, 255 300 Z" fill="#22C55E" stroke="#1A1A1A" stroke-width="5" />
    <!-- White Collar Trim -->
    <path d="M 120 200 C 130 220, 170 220, 180 200 Z" fill="#FFF" stroke="#1A1A1A" stroke-width="3.5" />

    <!-- Neck -->
    <rect x="130" y="160" width="40" height="40" fill="#FCEADE" stroke="#1A1A1A" stroke-width="4" />

    <!-- Ears -->
    <ellipse cx="94" cy="142" rx="14" ry="18" fill="#FCEADE" stroke="#1A1A1A" stroke-width="4.5" />
    <ellipse cx="206" cy="142" rx="14" ry="18" fill="#FCEADE" stroke="#1A1A1A" stroke-width="4.5" />

    <!-- Face Base -->
    <path d="M 104 105 C 104 75, 196 75, 196 105 C 196 160, 175 190, 150 195 C 125 190, 104 160, 104 105 Z" fill="#FCEADE" stroke="#1A1A1A" stroke-width="5" />

    <!-- Goofy Cheerful Cheeks -->
    <ellipse cx="116" cy="150" rx="12" ry="7" fill="#F87171" opacity="0.45" />
    <ellipse cx="184" cy="150" rx="12" ry="7" fill="#F87171" opacity="0.45" />

    <!-- Messy Fluffy Mint-Green Anime Hair -->
    <path d="M 90 105 C 80 48, 115 28, 150 26 C 185 28, 220 48, 210 105 C 225 75, 208 42, 185 34 C 160 26, 135 26, 112 36 C 94 45, 84 75, 90 105 Z" fill="#0D9488" stroke="#1A1A1A" stroke-width="5" />
    <!-- Fluffy Bangs -->
    <path d="M 95 95 L 115 122 L 126 98 L 145 125 L 155 96 L 175 122 L 195 95 Z" fill="#14B8A6" stroke="#1A1A1A" stroke-width="3.5" />

    <!-- Floating Sweat Drop on Head 💧 -->
    <path d="M 85 90 C 80 102, 90 110, 96 102 C 98 96, 90 85, 85 90 Z" fill="#38BDF8" stroke="#1A1A1A" stroke-width="2.5" filter="url(#derp_shadow)" />

    <!-- DERP SPIRAL / SWIRL DIZZY EYES 😵‍💫 -->
    <!-- Left Eye -->
    <circle cx="127" cy="122" r="15" fill="#FFF" stroke="#1A1A1A" stroke-width="3.5" />
    <path d="M 127 122 M 127 122 A 3 3 0 0 1 129 119 A 6 6 0 0 1 133 125 A 9 9 0 0 1 121 129 A 12 12 0 0 1 117 116" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round" />

    <!-- Right Eye -->
    <circle cx="173" cy="122" r="15" fill="#FFF" stroke="#1A1A1A" stroke-width="3.5" />
    <path d="M 173 122 M 173 122 A 3 3 0 0 1 175 119 A 6 6 0 0 1 179 125 A 9 9 0 0 1 167 129 A 12 12 0 0 1 163 116" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round" />

    <!-- Hilariously Confused Eyebrows (One high squiggle, one low flat) -->
    <path d="M 112 100 Q 124 90 136 102" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M 164 104 Q 174 100 186 106" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round" fill="none" />

    <!-- Nose -->
    <circle cx="150" cy="138" r="2.5" fill="#1A1A1A" />

    <!-- Wavy Confused Derp Smile with Cute Pink Tongue Sticking Out 😜 -->
    <path d="M 130 160 Q 140 168 152 158 Q 164 168 172 160" stroke="#1A1A1A" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <!-- Sticking Out Tongue -->
    <path d="M 152 160 C 152 174, 166 174, 166 160 Z" fill="#FB7185" stroke="#1A1A1A" stroke-width="2" />
    <line x1="159" y1="160" x2="159" y2="167" stroke="#E11D48" stroke-width="1.5" />
  </g>

  <circle cx="150" cy="150" r="142" fill="none" stroke="#1A1A1A" stroke-width="8" />
</svg>