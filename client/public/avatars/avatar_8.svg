<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="rofl_bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="70%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#FACC15" />
    </radialGradient>
    <filter id="tear_shine">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Comic Circle -->
  <circle cx="150" cy="150" r="142" fill="url(#rofl_bg)" stroke="#1A1A1A" stroke-width="8" />
  <circle cx="150" cy="150" r="133" fill="none" stroke="#EAB308" stroke-width="3" opacity="0.6" />

  <!-- Action Laughing Lines in Background -->
  <line x1="55" y1="90" x2="80" y2="105" stroke="#1A1A1A" stroke-width="3.5" stroke-linecap="round" />
  <line x1="50" y1="120" x2="75" y2="125" stroke="#1A1A1A" stroke-width="3.5" stroke-linecap="round" />
  <line x1="245" y1="90" x2="220" y2="105" stroke="#1A1A1A" stroke-width="3.5" stroke-linecap="round" />
  <line x1="250" y1="120" x2="225" y2="125" stroke="#1A1A1A" stroke-width="3.5" stroke-linecap="round" />

  <g clip-path="url(#roflClip)">
    <clipPath id="roflClip">
      <circle cx="150" cy="150" r="138" />
    </clipPath>

    <!-- Bright Orange Hoodie / Shoulders -->
    <path d="M 45 300 C 55 215, 95 200, 150 200 C 205 200, 245 215, 255 300 Z" fill="#FB923C" stroke="#1A1A1A" stroke-width="5" />
    <!-- White Inner Shirt -->
    <path d="M 125 200 L 150 235 L 175 200 Z" fill="#FFF" stroke="#1A1A1A" stroke-width="3.5" />
    <!-- Hoodie Strings Shaking with Laughter -->
    <path d="M 135 215 Q 130 240 138 260" stroke="#FFF" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 165 215 Q 170 240 162 260" stroke="#FFF" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Neck -->
    <rect x="130" y="160" width="40" height="40" fill="#FCEADE" stroke="#1A1A1A" stroke-width="4" />

    <!-- Ears -->
    <ellipse cx="94" cy="145" rx="14" ry="18" fill="#FCEADE" stroke="#1A1A1A" stroke-width="4.5" />
    <ellipse cx="206" cy="145" rx="14" ry="18" fill="#FCEADE" stroke="#1A1A1A" stroke-width="4.5" />

    <!-- Face Base (Tilted Back in Roaring Laughter) -->
    <path d="M 104 105 C 104 75, 196 75, 196 105 C 196 160, 175 190, 150 195 C 125 190, 104 160, 104 105 Z" fill="#FCEADE" stroke="#1A1A1A" stroke-width="5" />

    <!-- Bright Cherry Cheeks from Laughing So Hard -->
    <ellipse cx="114" cy="148" rx="15" ry="9" fill="#FB7185" opacity="0.6" />
    <ellipse cx="186" cy="148" rx="15" ry="9" fill="#FB7185" opacity="0.6" />

    <!-- Messy Brown Spiky Anime Hair -->
    <path d="M 90 105 C 80 50, 115 30, 150 28 C 185 30, 220 50, 210 105 C 225 75, 208 42, 185 34 C 160 26, 135 26, 112 36 C 94 45, 84 75, 90 105 Z" fill="#78350F" stroke="#1A1A1A" stroke-width="5" />
    <path d="M 96 95 L 115 118 L 128 96 L 146 122 L 158 96 L 176 120 L 194 95 Z" fill="#92400E" stroke="#1A1A1A" stroke-width="3.5" />

    <!-- Anime Laughter Eyes: Closed `> <` Style! 😆 -->
    <!-- Left Squeezed Eye '>' -->
    <path d="M 115 120 L 134 127 L 115 134" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Right Squeezed Eye '<' -->
    <path d="M 185 120 L 166 127 L 185 134" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Highly Curved Happy Laughing Eyebrows -->
    <path d="M 112 108 Q 125 96 138 108" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M 162 108 Q 175 96 188 108" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round" fill="none" />

    <!-- TEARS OF JOY GUSHING OUT! 🤣💧 -->
    <!-- Left Stream of Tears -->
    <path d="M 112 127 C 88 118, 76 140, 68 135 C 62 130, 72 110, 95 118 Z" fill="#38BDF8" stroke="#1A1A1A" stroke-width="2.5" filter="url(#tear_shine)" />
    <ellipse cx="80" cy="126" rx="4" ry="2" fill="#FFF" opacity="0.8" />
    <circle cx="58" cy="142" r="4.5" fill="#38BDF8" stroke="#1A1A1A" stroke-width="2" />
    <!-- Right Stream of Tears -->
    <path d="M 188 127 C 212 118, 224 140, 232 135 C 238 130, 228 110, 205 118 Z" fill="#38BDF8" stroke="#1A1A1A" stroke-width="2.5" filter="url(#tear_shine)" />
    <ellipse cx="220" cy="126" rx="4" ry="2" fill="#FFF" opacity="0.8" />
    <circle cx="242" cy="142" r="4.5" fill="#38BDF8" stroke="#1A1A1A" stroke-width="2" />

    <!-- Tiny Nose -->
    <circle cx="150" cy="138" r="2.5" fill="#1A1A1A" />

    <!-- Huge Laughing Open Mouth! 🤣 -->
    <path d="M 125 152 Q 150 146 175 152 C 178 185, 122 185, 125 152 Z" fill="#991B1B" stroke="#1A1A1A" stroke-width="4.5" />
    <!-- Top White Teeth Bar -->
    <path d="M 127 153 Q 150 148 173 153 L 171 160 Q 150 156 129 160 Z" fill="#FFF" stroke="#1A1A1A" stroke-width="1.5" />
    <!-- Big Bouncing Pink Tongue -->
    <path d="M 135 174 C 142 164, 158 164, 165 174 C 158 184, 142 184, 135 174 Z" fill="#F43F5E" />
  </g>

  <circle cx="150" cy="150" r="142" fill="none" stroke="#1A1A1A" stroke-width="8" />
</svg>