<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="queen_bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FCE7F3" />
      <stop offset="60%" stop-color="#DB2777" />
      <stop offset="100%" stop-color="#831843" />
    </radialGradient>
    <linearGradient id="dress_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BE185D" />
      <stop offset="100%" stop-color="#500724" />
    </linearGradient>
  </defs>

  <!-- Outer Circle -->
  <circle cx="150" cy="150" r="142" fill="url(#queen_bg)" stroke="#1A1A1A" stroke-width="8" />
  <circle cx="150" cy="150" r="133" fill="none" stroke="#F472B6" stroke-width="3" opacity="0.6" />

  <g clip-path="url(#qnClip)">
    <clipPath id="qnClip">
      <circle cx="150" cy="150" r="138" />
    </clipPath>

    <!-- Velvet Saloon Corset / Gown with Lace -->
    <path d="M 40 300 C 50 215, 95 200, 150 200 C 205 200, 250 215, 260 300 Z" fill="url(#dress_grad)" stroke="#1A1A1A" stroke-width="6" />
    <path d="M 115 200 Q 150 235 185 200" stroke="#FCE7F3" stroke-width="6" fill="none" />
    <circle cx="150" cy="218" r="4" fill="#F59E0B" />

    <!-- Big Voluminous Victorian Curls Hair -->
    <circle cx="95" cy="100" r="35" fill="#451A03" />
    <circle cx="85" cy="140" r="30" fill="#451A03" />
    <circle cx="205" cy="100" r="35" fill="#451A03" />
    <circle cx="215" cy="140" r="30" fill="#451A03" />

    <!-- Face Base -->
    <path d="M 110 95 C 110 65, 190 65, 190 95 C 190 150, 170 185, 150 188 C 130 185, 110 150, 110 95 Z" fill="#FCEADE" stroke="#1A1A1A" stroke-width="5" />

    <!-- Glamorous Winged Eyeliner & Eyes -->
    <path d="M 116 122 Q 130 114 142 122" stroke="#1A1A1A" stroke-width="4.5" fill="none" stroke-linecap="round" />
    <circle cx="130" cy="125" r="5.5" fill="#1A1A1A" />
    <circle cx="132" cy="123" r="2" fill="#FFF" />

    <path d="M 158 122 Q 170 114 184 122" stroke="#1A1A1A" stroke-width="4.5" fill="none" stroke-linecap="round" />
    <circle cx="170" cy="125" r="5.5" fill="#1A1A1A" />
    <circle cx="172" cy="123" r="2" fill="#FFF" />

    <!-- Beauty Mark / Mole ✨ -->
    <circle cx="135" cy="148" r="2" fill="#1A1A1A" />

    <!-- Rosy Cheeks -->
    <ellipse cx="120" cy="142" rx="10" ry="6" fill="#F43F5E" opacity="0.3" />
    <ellipse cx="180" cy="142" rx="10" ry="6" fill="#F43F5E" opacity="0.3" />

    <!-- Red Saloon Lips -->
    <path d="M 136 160 Q 150 174 164 160 Q 150 166 136 160 Z" fill="#BE123C" stroke="#1A1A1A" stroke-width="3" />

    <!-- Saloon Mini Fascinator Hat with Ostrich Feathers 👑 -->
    <ellipse cx="150" cy="55" rx="35" ry="12" fill="#831843" stroke="#1A1A1A" stroke-width="4" transform="rotate(-10 150 55)" />
    <!-- Fluffy Feathers -->
    <path d="M 160 50 C 180 20, 205 10, 220 5 C 205 25, 185 45, 165 52 Z" fill="#F472B6" stroke="#1A1A1A" stroke-width="3" />
    <path d="M 150 48 C 165 15, 185 5, 195 0 C 180 20, 165 38, 152 50 Z" fill="#BE185D" stroke="#1A1A1A" stroke-width="3" />
    <circle cx="150" cy="52" r="6" fill="#F59E0B" stroke="#1A1A1A" stroke-width="2" />
