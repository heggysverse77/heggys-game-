<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="bounty_bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#4B5563" />
      <stop offset="60%" stop-color="#1F2937" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
  </defs>

  <!-- Outer Circle -->
  <circle cx="150" cy="150" r="142" fill="url(#bounty_bg)" stroke="#1A1A1A" stroke-width="8" />
  <circle cx="150" cy="150" r="133" fill="none" stroke="#EF4444" stroke-width="3" opacity="0.6" />

  <g clip-path="url(#bhClip)">
    <clipPath id="bhClip">
      <circle cx="150" cy="150" r="138" />
    </clipPath>

    <!-- Heavy Duster Coat & Iron Armor Collar -->
    <path d="M 40 300 C 50 215, 95 200, 150 200 C 205 200, 250 215, 260 300 Z" fill="#18181B" stroke="#1A1A1A" stroke-width="6" />
    <path d="M 90 200 L 150 250 L 210 200 Z" fill="#27272A" stroke="#1A1A1A" stroke-width="4" />
    <!-- Silver Skull Pendant 💀 -->
    <circle cx="150" cy="225" r="9" fill="#94A3B8" stroke="#1A1A1A" stroke-width="2.5" />
    <circle cx="147" cy="223" r="1.5" fill="#1A1A1A" />
    <circle cx="153" cy="223" r="1.5" fill="#1A1A1A" />

    <!-- Face Base -->
    <path d="M 110 100 C 110 75, 190 75, 190 100 C 190 155, 170 185, 150 188 C 130 185, 110 155, 110 100 Z" fill="#E2BA96" stroke="#1A1A1A" stroke-width="5" />

    <!-- 5 o'clock Shadow Beard -->
    <path d="M 112 145 C 115 180, 185 180, 188 145 C 175 160, 125 160, 112 145 Z" fill="#1A1A1A" opacity="0.3" />

    <!-- Battle Scar across Left Eye ⚡ -->
    <line x1="165" y1="95" x2="178" y2="145" stroke="#991B1B" stroke-width="3" stroke-linecap="round" />
    <!-- Eyepatch on Right Eye 🏴‍☠️ -->
    <polygon points="116,110 142,118 138,136 112,126" fill="#18181B" stroke="#1A1A1A" stroke-width="3" />
    <line x1="110" y1="110" x2="80" y2="90" stroke="#18181B" stroke-width="3" />
    <line x1="140" y1="130" x2="170" y2="155" stroke="#18181B" stroke-width="2.5" />

    <!-- Fierce Left Eye with glowing amber iris -->
    <ellipse cx="172" cy="120" rx="8" ry="5.5" fill="#FFF" stroke="#1A1A1A" stroke-width="3" />
    <circle cx="170" cy="120" r="3.5" fill="#F59E0B" stroke="#1A1A1A" stroke-width="1" />
    <circle cx="170" cy="120" r="1.5" fill="#1A1A1A" />

    <!-- Grim Grin with Cigar -->
    <path d="M 136 160 L 160 160" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round" />
    <!-- Cigarillo 🚬 -->
    <rect x="156" y="156" width="22" height="6" rx="2" fill="#78350F" stroke="#1A1A1A" stroke-width="2" transform="rotate(-12 165 158)" />
    <circle cx="178" cy="153" r="3" fill="#EF4444" />

    <!-- Bounty Hunter Stetson Hat -->
    <path d="M 105 70 C 105 20, 120 15, 150 20 C 180 15, 195 20, 195 70 Z" fill="#27272A" stroke="#1A1A1A" stroke-width="6" />
    <path d="M 45 74 C 80 48, 220 48, 255 74 C 240 88, 60 88, 45 74 Z" fill="#27272A" stroke="#1A1A1A" stroke-width="6" />
    <!-- Hat Band with Silver Studs -->
    <path d="M 105 68 Q 150 74 195 68" stroke="#991B1B" stroke-width="6" fill="none" />
  </g>

  <circle cx="150" cy="150" r="142" fill="none" stroke="#1A1A1A" stroke-width="8" />
</svg>