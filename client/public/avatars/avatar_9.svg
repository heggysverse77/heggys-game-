<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="boss_bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2D1B08" />
      <stop offset="65%" stop-color="#1A1105" />
      <stop offset="100%" stop-color="#0A0602" />
    </radialGradient>
    <linearGradient id="gold_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8DC" />
      <stop offset="40%" stop-color="#FCD34D" />
      <stop offset="80%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="gold_shine">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Comic Circle -->
  <circle cx="150" cy="150" r="142" fill="url(#boss_bg)" stroke="#1A1A1A" stroke-width="8" />
  <circle cx="150" cy="150" r="133" fill="none" stroke="url(#gold_grad)" stroke-width="3.5" opacity="0.8" />

  <!-- Little Golden Crown Floating Over Head 👑 -->
  <path d="M 125 32 L 133 46 L 150 28 L 167 46 L 175 32 L 172 56 L 128 56 Z" fill="url(#gold_grad)" stroke="#1A1A1A" stroke-width="3" filter="url(#gold_shine)" />
  <circle cx="125" cy="30" r="2.5" fill="#EF4444" />
  <circle cx="150" cy="26" r="3" fill="#3B82F6" />
  <circle cx="175" cy="30" r="2.5" fill="#EF4444" />

  <g clip-path="url(#bossClip)">
    <clipPath id="bossClip">
      <circle cx="150" cy="150" r="138" />
    </clipPath>

    <!-- Sharp Black Tailored Suit Shoulders -->
    <path d="M 45 300 C 55 210, 95 195, 150 195 C 205 195, 245 210, 255 300 Z" fill="#111827" stroke="#1A1A1A" stroke-width="5" />
    <!-- Popped Suit Lapels with Burgundy Silk Lining -->
    <path d="M 85 205 L 125 255 L 110 300" fill="#7F1D1D" stroke="#1A1A1A" stroke-width="4" />
    <path d="M 215 205 L 175 255 L 190 300" fill="#7F1D1D" stroke="#1A1A1A" stroke-width="4" />
    <!-- Black Silk Shirt Opened V -->
    <path d="M 125 195 L 150 245 L 175 195 Z" fill="#E2A67B" stroke="#1A1A1A" stroke-width="3.5" />

    <!-- HEAVY CUBAN LINK GOLD CHAIN! 👑 -->
    <path d="M 116 195 C 122 238, 178 238, 184 195" fill="none" stroke="url(#gold_grad)" stroke-width="8" stroke-linecap="round" filter="url(#gold_shine)" />
    <path d="M 116 195 C 122 238, 178 238, 184 195" fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="3 3" />
    <!-- Big Gold Medallion Pendant -->
    <circle cx="150" cy="235" r="9" fill="url(#gold_grad)" stroke="#1A1A1A" stroke-width="3" filter="url(#gold_shine)" />
    <polygon points="150,229 152,234 157,234 153,237 155,242 150,239 145,242 147,237 143,234 148,234" fill="#1A1A1A" />

    <!-- Neck -->
    <rect x="128" y="155" width="44" height="45" fill="#E2A67B" stroke="#1A1A1A" stroke-width="4" />

    <!-- Ears & Gold Earring Stud -->
    <ellipse cx="94" cy="142" rx="14" ry="18" fill="#E2A67B" stroke="#1A1A1A" stroke-width="4.5" />
    <ellipse cx="206" cy="142" rx="14" ry="18" fill="#E2A67B" stroke="#1A1A1A" stroke-width="4.5" />
    <circle cx="91" cy="148" r="3.5" fill="url(#gold_grad)" stroke="#1A1A1A" stroke-width="1.5" />

    <!-- Strong Jaw Face Base -->
    <path d="M 104 105 C 104 75, 196 75, 196 105 C 196 160, 175 190, 150 195 C 125 190, 104 160, 104 105 Z" fill="#E2A67B" stroke="#1A1A1A" stroke-width="5" />

    <!-- Subtle Stubble Shadow on Jawline -->
    <path d="M 112 150 C 112 180, 135 190, 150 190 C 165 190, 188 180, 188 150 C 188 165, 170 175, 150 175 C 130 175, 112 165, 112 150 Z" fill="#1A1A1A" opacity="0.18" />

    <!-- Slick Undercut Hairstyle (Fade on sides, swept back dark brown on top) -->
    <path d="M 92 100 C 88 50, 115 32, 150 30 C 185 32, 212 50, 208 100 C 218 80, 205 45, 185 36 C 160 28, 135 28, 110 38 C 96 46, 88 75, 92 100 Z" fill="#1F2937" stroke="#1A1A1A" stroke-width="5" />
    <!-- Comb Lines in Swept Hair -->
    <path d="M 118 42 Q 148 55 178 44" stroke="#374151" stroke-width="2.5" fill="none" />
    <path d="M 125 54 Q 150 64 172 56" stroke="#374151" stroke-width="2.5" fill="none" />

    <!-- Sleek Black VIP Shades with Gold Frame -->
    <g transform="rotate(-1 150 124)">
      <!-- Left Lens -->
      <polygon points="106,112 142,112 138,138 112,138" fill="#111827" stroke="url(#gold_grad)" stroke-width="3.5" />
      <line x1="112" y1="116" x2="122" y2="134" stroke="#FFF" stroke-width="2" opacity="0.7" stroke-linecap="round" />
      <!-- Right Lens -->
      <polygon points="158,112 194,112 188,138 162,138" fill="#111827" stroke="url(#gold_grad)" stroke-width="3.5" />
      <line x1="164" y1="116" x2="174" y2="134" stroke="#FFF" stroke-width="2" opacity="0.7" stroke-linecap="round" />
      <!-- Center Bridge -->
      <line x1="142" y1="116" x2="158" y2="116" stroke="url(#gold_grad)" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Chiseled Nose -->
    <path d="M 150 122 L 146 142 L 154 142" stroke="#1A1A1A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Confident Knowing Mafia Smirk -->
    <path d="M 132 162 Q 148 168 168 158" stroke="#1A1A1A" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M 136 163 Q 148 166 164 160" fill="#FFF" />
  </g>

  <circle cx="150" cy="150" r="142" fill="none" stroke="#1A1A1A" stroke-width="8" />
</svg>