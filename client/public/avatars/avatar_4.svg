<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="shock_bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF0F3" />
      <stop offset="70%" stop-color="#FFCCD5" />
      <stop offset="100%" stop-color="#FF758F" />
    </radialGradient>
    <filter id="sweat_drop_shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#1A1A1A" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Circle -->
  <circle cx="150" cy="150" r="142" fill="url(#shock_bg)" stroke="#1A1A1A" stroke-width="8" />
  <circle cx="150" cy="150" r="133" fill="none" stroke="#FF4D6D" stroke-width="3" opacity="0.6" />

  <!-- Shocked Anime Lines in Background -->
  <line x1="60" y1="50" x2="80" y2="70" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round" />
  <line x1="50" y1="75" x2="75" y2="85" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round" />
  <line x1="240" y1="50" x2="220" y2="70" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round" />
  <line x1="250" y1="75" x2="225" y2="85" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round" />

  <g clip-path="url(#shockClip)">
    <clipPath id="shockClip">
      <circle cx="150" cy="150" r="138" />
    </clipPath>

    <!-- Coral Top / Shoulders -->
    <path d="M 45 300 C 55 215, 95 200, 150 200 C 205 200, 245 215, 255 300 Z" fill="#FF4D6D" stroke="#1A1A1A" stroke-width="5" />

    <!-- Cute Hands Holding Cheeks in Shock! 😱 -->
    <path d="M 80 180 C 80 145, 105 145, 105 175 Z" fill="#FCEADE" stroke="#1A1A1A" stroke-width="4" />
    <path d="M 220 180 C 220 145, 195 145, 195 175 Z" fill="#FCEADE" stroke="#1A1A1A" stroke-width="4" />

    <!-- Neck -->
    <rect x="130" y="165" width="40" height="40" fill="#FCEADE" stroke="#1A1A1A" stroke-width="4" />

    <!-- Face Base -->
    <path d="M 104 105 C 104 75, 196 75, 196 105 C 196 160, 175 190, 150 195 C 125 190, 104 160, 104 105 Z" fill="#FCEADE" stroke="#1A1A1A" stroke-width="5" />

    <!-- Panicked Blue/Purple Forehead Shadow (Anime Dread) -->
    <path d="M 104 90 C 120 100, 180 100, 196 90 L 196 75 C 160 65, 140 65, 104 75 Z" fill="#805AD5" opacity="0.3" />
    <line x1="125" y1="78" x2="125" y2="95" stroke="#6B46C1" stroke-width="2" opacity="0.5" />
    <line x1="140" y1="76" x2="140" y2="98" stroke="#6B46C1" stroke-width="2" opacity="0.5" />
    <line x1="155" y1="76" x2="155" y2="98" stroke="#6B46C1" stroke-width="2" opacity="0.5" />
    <line x1="170" y1="78" x2="170" y2="95" stroke="#6B46C1" stroke-width="2" opacity="0.5" />

    <!-- Pink Hair with Twin Buns / Ponytails -->
    <path d="M 90 105 C 80 50, 115 30, 150 28 C 185 30, 220 50, 210 105 C 215 75, 195 48, 150 46 C 105 48, 85 75, 90 105 Z" fill="#E85D75" stroke="#1A1A1A" stroke-width="5" />
    <!-- Bangs -->
    <path d="M 98 88 Q 120 115 135 92 Q 150 118 165 92 Q 180 115 202 88 Z" fill="#E85D75" stroke="#1A1A1A" stroke-width="3" />

    <!-- Massive Shocked Wide Eyes! 😳 -->
    <ellipse cx="126" cy="120" rx="14" ry="17" fill="#FFF" stroke="#1A1A1A" stroke-width="4" />
    <ellipse cx="174" cy="120" rx="14" ry="17" fill="#FFF" stroke="#1A1A1A" stroke-width="4" />
    <!-- Tiny Shrunken Pupils in Horror -->
    <circle cx="126" cy="120" r="4.5" fill="#1A1A1A" />
    <circle cx="174" cy="120" r="4.5" fill="#1A1A1A" />

    <!-- Floating Anime Sweat Drop on Temple 💧 -->
    <path d="M 86 95 C 80 108, 92 118, 98 108 C 100 102, 92 88, 86 95 Z" fill="#38BDF8" stroke="#1A1A1A" stroke-width="2.5" filter="url(#sweat_drop_shadow)" />
    <ellipse cx="91" cy="102" rx="2" ry="4" fill="#FFF" opacity="0.8" />

    <!-- Raised Wavy Panicked Eyebrows -->
    <path d="M 112 95 Q 125 88 138 98" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M 162 98 Q 175 88 188 95" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round" fill="none" />

    <!-- Tiny Nose Dot -->
    <circle cx="150" cy="132" r="2" fill="#1A1A1A" />

    <!-- Huge Open Screaming Mouth! 😱 -->
    <ellipse cx="150" cy="158" rx="15" ry="21" fill="#7A1C28" stroke="#1A1A1A" stroke-width="4" />
    <!-- Tongue in Mouth -->
    <path d="M 138 165 C 142 158, 158 158, 162 165 C 160 174, 140 174, 138 165 Z" fill="#F28482" />
  </g>

  <circle cx="150" cy="150" r="142" fill="none" stroke="#1A1A1A" stroke-width="8" />
</svg>