<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="cowgirl_bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FED7AA" />
      <stop offset="60%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#9A3412" />
    </radialGradient>
    <linearGradient id="hat_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="50%" stop-color="#92400E" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>
    <linearGradient id="bandana_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
  </defs>

  <!-- Outer Circle -->
  <circle cx="150" cy="150" r="142" fill="url(#cowgirl_bg)" stroke="#1A1A1A" stroke-width="8" />
  <circle cx="150" cy="150" r="133" fill="none" stroke="#FFA646" stroke-width="3" opacity="0.6" />

  <g clip-path="url(#cgClip)">
    <clipPath id="cgClip">
      <circle cx="150" cy="150" r="138" />
    </clipPath>

    <!-- Shoulders / Leather Vest -->
    <path d="M 40 300 C 50 215, 95 200, 150 200 C 205 200, 250 215, 260 300 Z" fill="#78350F" stroke="#1A1A1A" stroke-width="6" />
    <path d="M 110 215 L 150 260 L 190 215 Z" fill="#FEF3C7" stroke="#1A1A1A" stroke-width="4" />

    <!-- Red Western Bandana -->
    <path d="M 120 180 Q 150 230 180 180 Q 150 170 120 180 Z" fill="url(#bandana_grad)" stroke="#1A1A1A" stroke-width="4" />
    <polygon points="150,225 142,210 158,210" fill="#EF4444" stroke="#1A1A1A" stroke-width="3" />

    <!-- Neck -->
    <rect x="130" y="150" width="40" height="35" fill="#FCEADE" stroke="#1A1A1A" stroke-width="4" />

    <!-- Hair (Behind) -->
    <path d="M 80 130 C 65 190, 85 240, 100 270 C 115 240, 110 190, 110 160 Z" fill="#B45309" stroke="#1A1A1A" stroke-width="4" />
    <path d="M 220 130 C 235 190, 215 240, 200 270 C 185 240, 190 190, 190 160 Z" fill="#B45309" stroke="#1A1A1A" stroke-width="4" />

    <!-- Face -->
    <path d="M 108 105 C 108 75, 192 75, 192 105 C 192 155, 172 185, 150 188 C 128 185, 108 155, 108 105 Z" fill="#FCEADE" stroke="#1A1A1A" stroke-width="5" />

    <!-- Eyes (Confident & Cool) -->
    <path d="M 116 122 Q 130 115 140 122" stroke="#1A1A1A" stroke-width="4" fill="none" stroke-linecap="round" />
    <circle cx="128" cy="126" r="6" fill="#1A1A1A" />
    <circle cx="130" cy="124" r="2" fill="#FFF" />

    <path d="M 160 122 Q 170 115 184 122" stroke="#1A1A1A" stroke-width="4" fill="none" stroke-linecap="round" />
    <circle cx="172" cy="126" r="6" fill="#1A1A1A" />
    <circle cx="174" cy="124" r="2" fill="#FFF" />

    <!-- Eyebrows -->
    <path d="M 114 112 Q 128 104 142 110" stroke="#78350F" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 158 110 Q 172 104 186 112" stroke="#78350F" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Nose -->
    <path d="M 148 132 L 145 144 L 155 144" stroke="#D97706" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Smirk Smile with Red Lipstick -->
    <path d="M 136 160 Q 150 172 166 158" stroke="#DC2626" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Western Stetson Cowboy Hat -->
    <!-- Crown -->
    <path d="M 105 75 C 105 25, 120 18, 150 25 C 180 18, 195 25, 195 75 Z" fill="url(#hat_grad)" stroke="#1A1A1A" stroke-width="6" />
    <!-- Hat Crease -->
    <path d="M 130 35 Q 150 50 170 35" stroke="#451A03" stroke-width="4" fill="none" />
    <!-- Hat Brim (Curved Western) -->
    <path d="M 45 78 C 80 50, 220 50, 255 78 C 240 92, 60 92, 45 78 Z" fill="url(#hat_grad)" stroke="#1A1A1A" stroke-width="6" />
    <!-- Hat Band with Turquoise Gem -->
    <path d="M 106 72 Q 150 78 194 72" stroke="#0D9488" stroke-width="7" fill="none" />
    <circle cx="150" cy="74" r="5" fill="#2DD4BF" stroke="#1A1A1A" stroke-width="2" />
  </g>

  <circle cx="150" cy="150" r="142" fill="none" stroke="#1A1A1A" stroke-width="8" />
</svg>