<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="sheriff_bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="55%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </radialGradient>
    <linearGradient id="sheriff_hat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="50%" stop-color="#92400E" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>
    <linearGradient id="vest_leather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400E" />
      <stop offset="100%" stop-color="#5B290B" />
    </linearGradient>
    <linearGradient id="silverStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
  </defs>

  <!-- Outer Circle Frame -->
  <circle cx="150" cy="150" r="142" fill="url(#sheriff_bg)" stroke="#1C1917" stroke-width="8" />
  <circle cx="150" cy="150" r="133" fill="none" stroke="#FDE047" stroke-width="3" opacity="0.6" />

  <g clip-path="url(#sheriffClip)">
    <clipPath id="sheriffClip">
      <circle cx="150" cy="150" r="138" />
    </clipPath>

    <!-- Shoulders / Leather Sheriff Vest & Shirt -->
    <path d="M 40 300 C 50 215, 95 200, 150 200 C 205 200, 250 215, 260 300 Z" fill="url(#vest_leather)" stroke="#1C1917" stroke-width="6" />
    <path d="M 100 210 L 150 270 L 200 210 Z" fill="#FEF3C7" stroke="#1C1917" stroke-width="4" />

    <!-- Western Bolo Tie -->
    <path d="M 140 210 L 150 250 L 160 210" stroke="#1C1917" stroke-width="3" fill="none" />
    <circle cx="150" cy="225" r="5" fill="#0D9488" stroke="#1C1917" stroke-width="2" />
    <line x1="147" y1="230" x2="145" y2="255" stroke="#1C1917" stroke-width="2.5" />
    <line x1="153" y1="230" x2="155" y2="255" stroke="#1C1917" stroke-width="2.5" />

    <!-- Gleaming Silver 6-Point Sheriff Star Badge ⭐ -->
    <g transform="translate(195, 225) scale(1.4)">
      <!-- Star Polygon -->
      <polygon points="0,-12 3.5,-4 11.5,-4 5.5,1.5 8,9.5 0,4.5 -8,9.5 -5.5,1.5 -11.5,-4 -3.5,-4" fill="url(#silverStar)" stroke="#1C1917" stroke-width="1.8" stroke-linejoin="round" />
      <circle cx="0" cy="0" r="3.5" fill="#F8FAFC" stroke="#1C1917" stroke-width="1" />
      <!-- Star Ball tips -->
      <circle cx="0" cy="-12" r="1.2" fill="#FFFFFF" />
      <circle cx="11.5" cy="-4" r="1.2" fill="#FFFFFF" />
      <circle cx="8" cy="9.5" r="1.2" fill="#FFFFFF" />
      <circle cx="-8" cy="9.5" r="1.2" fill="#FFFFFF" />
      <circle cx="-11.5" cy="-4" r="1.2" fill="#FFFFFF" />
    </g>

    <!-- Neck -->
    <rect x="130" y="150" width="40" height="40" fill="#FCEADE" stroke="#1C1917" stroke-width="4" />

    <!-- Face Base -->
    <path d="M 106 100 C 106 70, 194 70, 194 100 C 194 155, 174 188, 150 190 C 126 188, 106 155, 106 100 Z" fill="#FCEADE" stroke="#1C1917" stroke-width="5" />

    <!-- Confident Eyes -->
    <ellipse cx="128" cy="120" rx="7" ry="5.5" fill="#FFF" stroke="#1C1917" stroke-width="3" />
    <circle cx="130" cy="120" r="3.5" fill="#1C1917" />
    <circle cx="131" cy="119" r="1" fill="#FFF" />

    <ellipse cx="172" cy="120" rx="7" ry="5.5" fill="#FFF" stroke="#1C1917" stroke-width="3" />
    <circle cx="170" cy="120" r="3.5" fill="#1C1917" />
    <circle cx="171" cy="119" r="1" fill="#FFF" />

    <!-- Confident Eyebrows -->
    <path d="M 116 108 Q 130 102 142 108" stroke="#5B290B" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 158 108 Q 170 102 184 108" stroke="#5B290B" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Nose -->
    <path d="M 148 126 L 145 138 L 155 138" stroke="#C2410C" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Classic Western Sheriff Mustache 🥸 -->
    <path d="M 150 144 C 132 138, 115 152, 108 146 C 116 138, 136 135, 150 140 C 164 135, 184 138, 192 146 C 185 152, 168 138, 150 144 Z" fill="#451A03" stroke="#1C1917" stroke-width="2.5" />

    <!-- Friendly Grin -->
    <path d="M 138 158 Q 150 168 162 158" stroke="#1C1917" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Sheriff Cowboy Stetson Hat -->
    <!-- Crown -->
    <path d="M 104 72 C 104 20, 120 12, 150 20 C 180 12, 196 20, 196 72 Z" fill="url(#sheriff_hat)" stroke="#1C1917" stroke-width="6" />
    <!-- Hat Crown Crease -->
    <path d="M 128 32 Q 150 48 172 32" stroke="#451A03" stroke-width="3.5" fill="none" />
    <!-- Hat Brim (Curved Western) -->
    <path d="M 45 74 C 80 48, 220 48, 255 74 C 240 88, 60 88, 45 74 Z" fill="url(#sheriff_hat)" stroke="#1C1917" stroke-width="6" />
    <!-- Hat Band with Silver Studs -->
    <path d="M 105 68 Q 150 74 195 68" stroke="#D97706" stroke-width="6" fill="none" />
    <circle cx="130" cy="71" r="2.5" fill="#FFFFFF" />
    <circle cx="150" cy="73" r="3" fill="#FFFFFF" />
    <circle cx="170" cy="71" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Outer Ring Border -->
  <circle cx="150" cy="150" r="142" fill="none" stroke="#1C1917" stroke-width="8" />
</svg>