<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="outlaw_bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FED7AA" />
      <stop offset="55%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#7C2D12" />
    </radialGradient>
    <linearGradient id="hair_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B290B" />
      <stop offset="50%" stop-color="#451A03" />
      <stop offset="100%" stop-color="#1C0902" />
    </linearGradient>
    <linearGradient id="jacket_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272A" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
  </defs>

  <!-- Outer Circle Frame -->
  <circle cx="150" cy="150" r="142" fill="url(#outlaw_bg)" stroke="#1C1917" stroke-width="8" />
  <circle cx="150" cy="150" r="133" fill="none" stroke="#F59E0B" stroke-width="3" opacity="0.6" />

  <g clip-path="url(#outlawClip)">
    <clipPath id="outlawClip">
      <circle cx="150" cy="150" r="138" />
    </clipPath>

    <!-- Rising Cigarette Smoke Trail in Background 💨 -->
    <path d="M 188 170 Q 210 140 195 105 Q 180 70 215 35 Q 230 15 225 -10" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.4" />
    <path d="M 188 170 Q 215 135 205 100 Q 195 65 228 30" stroke="#FED7AA" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5" />

    <!-- Shoulders / Black Leather Jacket & White Undershirt -->
    <path d="M 35 300 C 45 215, 95 200, 150 200 C 205 200, 255 215, 265 300 Z" fill="url(#jacket_grad)" stroke="#1C1917" stroke-width="6" />
    <!-- White T-Shirt V-Neck -->
    <path d="M 115 215 L 150 270 L 185 215 Z" fill="#F4F4F5" stroke="#1C1917" stroke-width="3.5" />
    <!-- Jacket Lapel Collar -->
    <polygon points="105,200 135,260 115,260 90,205" fill="#3F3F46" stroke="#1C1917" stroke-width="3" />
    <polygon points="195,200 165,260 185,260 210,205" fill="#3F3F46" stroke="#1C1917" stroke-width="3" />

    <!-- Neck -->
    <rect x="128" y="155" width="44" height="45" fill="#FCEADE" stroke="#1C1917" stroke-width="4" />
    <path d="M 128 175 Q 150 190 172 175" stroke="#E2BA96" stroke-width="3" fill="none" />

    <!-- Wavy Back Hair -->
    <path d="M 80 120 C 70 60, 95 30, 150 25 C 205 30, 230 60, 220 120 C 235 150, 215 180, 210 185 C 190 170, 195 140, 190 130 C 110 130, 105 170, 90 185 C 85 180, 65 150, 80 120 Z" fill="url(#hair_grad)" stroke="#1C1917" stroke-width="5" />

    <!-- Strong Chiseled Jaw & Face -->
    <path d="M 104 105 C 104 70, 196 70, 196 105 C 196 160, 178 192, 150 196 C 122 192, 104 160, 104 105 Z" fill="#FCEADE" stroke="#1C1917" stroke-width="5" />

    <!-- Light 5 O'Clock Stubble Shadow -->
    <path d="M 108 150 C 115 185, 185 185, 192 150 C 180 170, 120 170, 108 150 Z" fill="#451A03" opacity="0.18" />

    <!-- Front Voluminous Wavy Hair Locks -->
    <path d="M 88 95 C 95 40, 140 25, 155 30 C 175 22, 212 38, 212 90 C 195 80, 180 85, 170 75 C 150 90, 135 65, 120 85 C 105 75, 95 90, 88 95 Z" fill="url(#hair_grad)" stroke="#1C1917" stroke-width="4.5" />
    <path d="M 100 65 Q 125 50 145 65" stroke="#78350F" stroke-width="2.5" fill="none" />
    <path d="M 155 55 Q 175 42 195 60" stroke="#78350F" stroke-width="2.5" fill="none" />

    <!-- Cool Dark Sunglasses 🕶️ -->
    <!-- Left Lens Frame -->
    <polygon points="106,112 144,112 140,138 112,138" fill="#18181B" stroke="#1C1917" stroke-width="4" stroke-linejoin="round" />
    <!-- Right Lens Frame -->
    <polygon points="156,112 194,112 188,138 160,138" fill="#18181B" stroke="#1C1917" stroke-width="4" stroke-linejoin="round" />
    <!-- Sunglasses Bridge -->
    <rect x="142" y="114" width="16" height="4" fill="#18181B" stroke="#1C1917" stroke-width="1.5" />
    <!-- Sunglasses Lens Gloss Reflection -->
    <polygon points="110,115 125,115 116,134 112,134" fill="#FFFFFF" opacity="0.35" />
    <polygon points="160,115 175,115 166,134 162,134" fill="#FFFFFF" opacity="0.35" />
    <!-- Sunglasses Side Arms -->
    <line x1="106" y1="115" x2="98" y2="120" stroke="#1C1917" stroke-width="3.5" />
    <line x1="194" y1="115" x2="202" y2="120" stroke="#1C1917" stroke-width="3.5" />

    <!-- Chiseled Nose -->
    <path d="M 150 128 L 146 146 L 154 146" stroke="#C2410C" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Firm Mouth / Confident Smirk -->
    <path d="M 136 166 Q 148 168 164 164" stroke="#1C1917" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- Lit Cigarette in Mouth 🚬 -->
    <rect x="156" y="162" width="34" height="6" rx="2" fill="#FFFFFF" stroke="#1C1917" stroke-width="2" transform="rotate(-8 165 165)" />
    <!-- Filter -->
    <rect x="156" y="162" width="10" height="6" rx="1" fill="#D97706" transform="rotate(-8 165 165)" />
    <!-- Burning Ember Tip -->
    <circle cx="190" cy="158" r="3.5" fill="#EF4444" />
    <circle cx="190" cy="158" r="2" fill="#FBBF24" />
  </g>

  <!-- Crisp Outer Ring Border -->
  <circle cx="150" cy="150" r="142" fill="none" stroke="#1C1917" stroke-width="8" />
</svg>