<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="smoker_bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2B2D42" />
      <stop offset="70%" stop-color="#1A1C29" />
      <stop offset="100%" stop-color="#0D0E15" />
    </radialGradient>
    <filter id="smoke_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Comic Circle -->
  <circle cx="150" cy="150" r="142" fill="url(#smoker_bg)" stroke="#1A1A1A" stroke-width="8" />
  <circle cx="150" cy="150" r="133" fill="none" stroke="#F6BD60" stroke-width="3" opacity="0.6" />

  <g clip-path="url(#smokerClip)">
    <clipPath id="smokerClip">
      <circle cx="150" cy="150" r="138" />
    </clipPath>

    <!-- Dark Leather Jacket / Shoulders -->
    <path d="M 40 300 C 50 215, 95 200, 150 200 C 205 200, 250 215, 260 300 Z" fill="#1C1D24" stroke="#1A1A1A" stroke-width="5" />
    <!-- White T-Shirt V-Neck -->
    <path d="M 120 200 L 150 240 L 180 200 Z" fill="#FFF6E5" stroke="#1A1A1A" stroke-width="4" />
    <!-- Jacket Lapels -->
    <path d="M 90 205 L 125 250 L 115 300" fill="#2B2D42" stroke="#1A1A1A" stroke-width="4" />
    <path d="M 210 205 L 175 250 L 185 300" fill="#2B2D42" stroke="#1A1A1A" stroke-width="4" />

    <!-- Neck -->
    <rect x="128" y="160" width="44" height="45" fill="#E8B28E" stroke="#1A1A1A" stroke-width="4" />
    <path d="M 128 160 C 140 180, 160 180, 172 160 Z" fill="#D29367" />

    <!-- Ears & Silver Stud Earring -->
    <ellipse cx="94" cy="142" rx="14" ry="18" fill="#E8B28E" stroke="#1A1A1A" stroke-width="4.5" />
    <ellipse cx="206" cy="142" rx="14" ry="18" fill="#E8B28E" stroke="#1A1A1A" stroke-width="4.5" />
    <circle cx="91" cy="149" r="3.5" fill="#FFF" stroke="#1A1A1A" stroke-width="1.5" />

    <!-- Face Base -->
    <path d="M 104 105 C 104 75, 196 75, 196 105 C 196 160, 175 190, 150 192 C 125 190, 104 160, 104 105 Z" fill="#F3C3A2" stroke="#1A1A1A" stroke-width="5" />

    <!-- Messy Cool Ash-Blonde Anime Hair -->
    <path d="M 90 105 C 80 45, 120 28, 150 28 C 180 28, 220 45, 210 105 C 220 80, 205 45, 185 38 C 160 30, 130 30, 110 40 C 95 50, 85 80, 90 105 Z" fill="#E9C46A" stroke="#1A1A1A" stroke-width="5" />
    <!-- Front Hair Bangs Spilling Over Face -->
    <path d="M 94 98 L 112 125 L 122 102 L 138 132 L 152 100 L 168 135 L 180 102 L 195 125 L 204 95 Q 150 75 94 98 Z" fill="#F4A261" stroke="#1A1A1A" stroke-width="4" />

    <!-- Relaxed Cool Half-Lidded Eyes -->
    <path d="M 116 122 Q 130 116 142 122" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M 158 122 Q 170 116 184 122" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round" fill="none" />
    <!-- Half-Visible Irises -->
    <path d="M 124 123 A 5 5 0 0 0 134 123 Z" fill="#264653" stroke="#1A1A1A" stroke-width="2" />
    <path d="M 166 123 A 5 5 0 0 0 176 123 Z" fill="#264653" stroke="#1A1A1A" stroke-width="2" />

    <!-- Cool Straight Nose -->
    <path d="M 150 120 L 147 142 L 154 142" stroke="#1A1A1A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Relaxed Smirk with Cigarette Held in Mouth -->
    <path d="M 134 162 Q 145 160 162 165" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Lit Cigarette -->
    <g transform="rotate(-15 138 163)">
      <rect x="110" y="160" width="30" height="5.5" rx="1" fill="#FFF" stroke="#1A1A1A" stroke-width="1.5" />
      <rect x="132" y="160" width="8" height="5.5" fill="#E76F51" />
      <!-- Glowing Red Cherry Tip -->
      <circle cx="109" cy="162.7" r="3" fill="#E63946" filter="url(#smoke_glow)" />
      <circle cx="109" cy="162.7" r="1.5" fill="#FFE3E0" />
    </g>

    <!-- Swirling Smoke Streams -->
    <path d="M 104 156 Q 85 140 92 120 Q 98 100 85 80 Q 75 60 90 40" fill="none" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <path d="M 108 152 Q 95 132 105 110 Q 115 90 102 70" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  </g>

  <circle cx="150" cy="150" r="142" fill="none" stroke="#1A1A1A" stroke-width="8" />
</svg>