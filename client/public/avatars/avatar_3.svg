<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="grad_avatar_3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4DB" />
      <stop offset="100%" stop-color="#0083B0" />
    </linearGradient>
    <filter id="glow_avatar_3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Glow Circle -->
  <circle cx="60" cy="60" r="56" fill="url(#grad_avatar_3)" stroke="#00F2FE" stroke-width="4" />
  
  <!-- Inner Subtle Ring -->
  <circle cx="60" cy="60" r="48" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" stroke-dasharray="4,4" />
  
  <!-- Main Emoji / Character -->
  <text x="60" y="68" font-size="52" text-anchor="middle" dominant-baseline="central" style="filter: drop-shadow(0 4px 6px rgba(0,0,0,0.35));">🐼</text>
  
  <!-- Accessory Badge (Bottom Right) -->
  <circle cx="92" cy="92" r="16" fill="#1C1033" stroke="#00F2FE" stroke-width="2" />
  <text x="92" y="94" font-size="16" text-anchor="middle" dominant-baseline="central">🕶️</text>
</svg>