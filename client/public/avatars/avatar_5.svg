<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="cyber_bg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="85%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <filter id="neon_cyan">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="neon_pink">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Circle -->
  <circle cx="150" cy="150" r="142" fill="url(#cyber_bg)" stroke="#1A1A1A" stroke-width="8" />
  <circle cx="150" cy="150" r="133" fill="none" stroke="#00F5D4" stroke-width="3" opacity="0.6" />

  <g clip-path="url(#cyberClip)">
    <clipPath id="cyberClip">
      <circle cx="150" cy="150" r="138" />
    </clipPath>

    <!-- Dark Cyber Hoodie with Neon Trim -->
    <path d="M 45 300 C 55 215, 95 200, 150 200 C 205 200, 245 215, 255 300 Z" fill="#1E293B" stroke="#1A1A1A" stroke-width="5" />
    <path d="M 115 215 L 150 250 L 185 215" fill="none" stroke="#7B2CBF" stroke-width="4" filter="url(#neon_pink)" />

    <!-- Neck -->
    <rect x="128" y="160" width="44" height="45" fill="#E2A67B" stroke="#1A1A1A" stroke-width="4" />

    <!-- Big Cyber Headset Band Across Crown -->
    <path d="M 80 135 C 75 60, 225 60, 220 135" fill="none" stroke="#1A1A1A" stroke-width="12" stroke-linecap="round" />
    <path d="M 82 135 C 78 65, 222 65, 218 135" fill="none" stroke="#00F5D4" stroke-width="4" stroke-linecap="round" filter="url(#neon_cyan)" />

    <!-- Earcups with Glowing RGB Rings -->
    <rect x="68" y="125" width="22" height="40" rx="10" fill="#1A1A1A" stroke="#00F5D4" stroke-width="3" filter="url(#neon_cyan)" />
    <rect x="210" y="125" width="22" height="40" rx="10" fill="#1A1A1A" stroke="#FF007F" stroke-width="3" filter="url(#neon_pink)" />
    <!-- Headset Microphone Booming Out -->
    <path d="M 75 155 Q 85 185 125 178" fill="none" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round" />
    <circle cx="125" cy="178" r="4" fill="#00F5D4" filter="url(#neon_cyan)" />

    <!-- Face Base -->
    <path d="M 104 105 C 104 75, 196 75, 196 105 C 196 160, 175 190, 150 195 C 125 190, 104 160, 104 105 Z" fill="#F3C3A2" stroke="#1A1A1A" stroke-width="5" />

    <!-- Spiky Cyber Anime Hair (Deep Purple/Black) -->
    <path d="M 94 105 C 85 45, 115 28, 150 28 C 185 28, 215 45, 206 105 C 220 75, 205 45, 185 36 C 160 28, 135 28, 110 38 Z" fill="#240046" stroke="#1A1A1A" stroke-width="5" />
    <!-- Hair Bangs with Neon Blue Highlights -->
    <path d="M 98 95 L 115 120 L 125 98 L 145 125 L 155 98 L 175 122 L 188 95 Z" fill="#3C096C" stroke="#1A1A1A" stroke-width="3.5" />
    <path d="M 138 100 L 145 125 L 150 110" stroke="#00F5D4" stroke-width="2.5" fill="none" filter="url(#neon_cyan)" />

    <!-- Holographic Cyberpunk Visor Across Eyes -->
    <path d="M 96 112 Q 150 120 204 112 L 200 134 Q 150 144 100 134 Z" fill="#00F5D4" opacity="0.85" stroke="#1A1A1A" stroke-width="3" filter="url(#neon_cyan)" />
    <!-- Digital Scanlines on Visor -->
    <line x1="105" y1="120" x2="195" y2="120" stroke="#FFF" stroke-width="1.5" opacity="0.7" />
    <line x1="108" y1="126" x2="192" y2="126" stroke="#FFF" stroke-width="1" opacity="0.5" />

    <!-- Nose -->
    <path d="M 150 132 L 147 145 L 154 145" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Energetic Gamer Smirk -->
    <path d="M 134 165 Q 150 178 168 160" stroke="#1A1A1A" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M 137 166 Q 150 176 166 162" fill="#FFF" />
  </g>

  <circle cx="150" cy="150" r="142" fill="none" stroke="#1A1A1A" stroke-width="8" />
</svg>