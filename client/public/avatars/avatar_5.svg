<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="gambler_bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="60%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>
    <linearGradient id="vest_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991B1B" />
      <stop offset="100%" stop-color="#450A0A" />
    </linearGradient>
  </defs>

  <!-- Outer Circle -->
  <circle cx="150" cy="150" r="142" fill="url(#gambler_bg)" stroke="#1A1A1A" stroke-width="8" />
  <circle cx="150" cy="150" r="133" fill="none" stroke="#FFA646" stroke-width="3" opacity="0.6" />

  <g clip-path="url(#gmClip)">
    <clipPath id="gmClip">
      <circle cx="150" cy="150" r="138" />
    </clipPath>

    <!-- Fancy Saloon Suit & Red Velvet Vest -->
    <path d="M 40 300 C 50 215, 95 200, 150 200 C 205 200, 250 215, 260 300 Z" fill="#1E293B" stroke="#1A1A1A" stroke-width="6" />
    <path d="M 95 210 L 150 270 L 205 210 Z" fill="url(#vest_grad)" stroke="#1A1A1A" stroke-width="4" />
    <polygon points="150,205 138,245 162,245" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3" />
    <!-- Gold Pocket Watch Chain -->
    <path d="M 125 240 Q 150 260 175 235" stroke="#F59E0B" stroke-width="4" fill="none" />
    <circle cx="150" cy="225" r="3" fill="#F59E0B" />
    <circle cx="150" cy="245" r="3" fill="#F59E0B" />

    <!-- Neck & Wingtip Collar -->
    <rect x="132" y="160" width="36" height="35" fill="#FCEADE" stroke="#1A1A1A" stroke-width="4" />
    <polygon points="150,185 130,195 170,195" fill="#1E293B" stroke="#1A1A1A" stroke-width="3" />

    <!-- Face Base -->
    <path d="M 110 105 C 110 75, 190 75, 190 105 C 190 155, 170 185, 150 188 C 130 185, 110 155, 110 105 Z" fill="#FCEADE" stroke="#1A1A1A" stroke-width="5" />

    <!-- Well-groomed Mustache -->
    <path d="M 150 150 C 135 145, 120 158, 115 152 C 122 144, 140 142, 150 148 C 160 142, 178 144, 185 152 C 180 158, 165 145, 150 150 Z" fill="#1A1A1A" />

    <!-- Smirk -->
    <path d="M 140 162 Q 155 168 165 158" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Sharp Eyes with Sly Wink / Glint -->
    <ellipse cx="130" cy="125" rx="7" ry="5" fill="#FFF" stroke="#1A1A1A" stroke-width="3" />
    <circle cx="132" cy="125" r="3.5" fill="#1A1A1A" />
    <path d="M 162 125 Q 174 120 180 126" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Gambler Fedora / Derby Hat -->
    <path d="M 112 75 C 112 25, 125 20, 150 22 C 175 20, 188 25, 188 75 Z" fill="#1E293B" stroke="#1A1A1A" stroke-width="5" />
    <!-- Hat Brim -->
    <path d="M 60 76 C 90 58, 210 58, 240 76 C 225 88, 75 88, 60 76 Z" fill="#1E293B" stroke="#1A1A1A" stroke-width="5" />
    <!-- Hat Ribbon with Card Stuck in it -->
    <path d="M 112 70 Q 150 75 188 70" stroke="#991B1B" stroke-width="7" fill="none" />
    <!-- Ace of Spades Card in Hat Band ♠ -->
    <rect x="175" y="45" width="22" height="30" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2.5" transform="rotate(15 185 60)" />
    <text x="181" y="65" font-size="14" font-weight="900" fill="#1A1A1A" transform="rotate(15 185 60)">♠</text>
  </g>

  <circle cx="150" cy="150" r="142" fill="none" stroke="#1A1A1A" stroke-width="8" />
</svg>