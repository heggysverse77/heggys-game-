<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="smug_bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3A0CA3" />
      <stop offset="70%" stop-color="#240046" />
      <stop offset="100%" stop-color="#10002B" />
    </radialGradient>
  </defs>

  <!-- Outer Circle -->
  <circle cx="150" cy="150" r="142" fill="url(#smug_bg)" stroke="#1A1A1A" stroke-width="8" />
  <circle cx="150" cy="150" r="133" fill="none" stroke="#F72585" stroke-width="3" opacity="0.6" />

  <g clip-path="url(#smugClip)">
    <clipPath id="smugClip">
      <circle cx="150" cy="150" r="138" />
    </clipPath>

    <!-- Dark High Collar Coat -->
    <path d="M 45 300 C 55 215, 95 200, 150 200 C 205 200, 245 215, 255 300 Z" fill="#181824" stroke="#1A1A1A" stroke-width="5" />
    <!-- High Collar Flaps -->
    <path d="M 105 215 L 125 170 L 150 215 Z" fill="#7209B7" stroke="#1A1A1A" stroke-width="3.5" />
    <path d="M 195 215 L 175 170 L 150 215 Z" fill="#7209B7" stroke="#1A1A1A" stroke-width="3.5" />

    <!-- Neck -->
    <rect x="130" y="160" width="40" height="40" fill="#E2A67B" stroke="#1A1A1A" stroke-width="4" />

    <!-- Ears & Piercing -->
    <ellipse cx="94" cy="142" rx="14" ry="18" fill="#E2A67B" stroke="#1A1A1A" stroke-width="4.5" />
    <ellipse cx="206" cy="142" rx="14" ry="18" fill="#E2A67B" stroke="#1A1A1A" stroke-width="4.5" />
    <circle cx="91" cy="138" r="3" fill="#F72585" stroke="#1A1A1A" stroke-width="1.5" />

    <!-- Face Base -->
    <path d="M 104 105 C 104 75, 196 75, 196 105 C 196 160, 175 190, 150 195 C 125 190, 104 160, 104 105 Z" fill="#EAA67C" stroke="#1A1A1A" stroke-width="5" />

    <!-- Playful Comic Red Devil Horns on Top! 😈 -->
    <path d="M 108 50 C 95 32, 100 12, 116 16 C 114 30, 115 42, 118 52 Z" fill="#F72585" stroke="#1A1A1A" stroke-width="3.5" />
    <path d="M 192 50 C 205 32, 200 12, 184 16 C 186 30, 185 42, 182 52 Z" fill="#F72585" stroke="#1A1A1A" stroke-width="3.5" />

    <!-- Spiky Dark Anime Hair -->
    <path d="M 92 105 C 82 50, 115 32, 150 30 C 185 32, 218 50, 208 105 C 220 75, 205 45, 185 36 C 160 28, 135 28, 110 38 Z" fill="#1C1A2E" stroke="#1A1A1A" stroke-width="5" />
    <!-- Bangs -->
    <path d="M 96 95 L 115 120 L 125 98 L 142 125 L 155 95 L 175 125 L 195 95 Z" fill="#2D2847" stroke="#1A1A1A" stroke-width="3.5" />

    <!-- Smug Sly Eyes: Narrow & Calculating -->
    <!-- Left Eye: Half squinting -->
    <ellipse cx="127" cy="122" rx="10" ry="7" fill="#FFF" stroke="#1A1A1A" stroke-width="3.5" />
    <circle cx="129" cy="122" r="5" fill="#7209B7" />
    <circle cx="129" cy="122" r="2.5" fill="#1A1A1A" />
    <!-- Right Eye: Open with Raised Eyebrow -->
    <ellipse cx="173" cy="120" rx="10" ry="9" fill="#FFF" stroke="#1A1A1A" stroke-width="3.5" />
    <circle cx="173" cy="120" r="5.5" fill="#7209B7" />
    <circle cx="173" cy="120" r="3" fill="#1A1A1A" />
    <circle cx="171" cy="118" r="1.8" fill="#FFF" />

    <!-- Highly Asymmetrical Eyebrows: One Flat, One Way Up! -->
    <path d="M 115 116 L 138 114" stroke="#1A1A1A" stroke-width="5.5" stroke-linecap="round" />
    <path d="M 160 106 Q 172 94 186 102" stroke="#1A1A1A" stroke-width="5.5" stroke-linecap="round" fill="none" />

    <!-- Nose -->
    <path d="M 150 120 L 147 138 L 154 139" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Devilish Sideways Grin Showing Canine Tooth! -->
    <path d="M 132 160 Q 150 178 172 152" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round" fill="none" />
    <!-- Little Sharp Canine Fang -->
    <path d="M 160 158 L 166 166 L 168 156 Z" fill="#FFF" stroke="#1A1A1A" stroke-width="1.5" />
  </g>

  <circle cx="150" cy="150" r="142" fill="none" stroke="#1A1A1A" stroke-width="8" />
</svg>